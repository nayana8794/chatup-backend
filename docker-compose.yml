version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: chatup_postgres
    restart: always
    environment:
      POSTGRES_USER: chatup_admin
      POSTGRES_PASSWORD: chatup_secure_password
      POSTGRES_DB: chatup_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
